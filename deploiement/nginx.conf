# La configuration du serveur statique de l'image de production.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # Les modeles et le WebAssembly doivent arriver avec le bon type, sinon
    # onnxruntime et MediaPipe refusent de les charger.
    types {
        application/wasm    wasm;
        application/octet-stream  onnx tflite;
    }
    include /etc/nginx/mime.types;

    # MediaPipe utilise SharedArrayBuffer quand il peut : ces deux en-tetes le
    # rendent disponible, et n'ont aucun effet de bord ici (rien n'est embarque).
    add_header Cross-Origin-Opener-Policy   same-origin   always;
    add_header Cross-Origin-Embedder-Policy require-corp  always;
    add_header X-Content-Type-Options       nosniff       always;
    add_header Referrer-Policy              no-referrer   always;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # Les fichiers empreintes par Vite ne changent jamais : on peut les garder longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Les modeles sont gros et stables.
    location /modeles/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
