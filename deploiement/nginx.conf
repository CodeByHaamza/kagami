# La configuration du serveur statique de l'image de production.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # Les modeles et le WebAssembly doivent arriver avec le bon type, sinon
    # onnxruntime et MediaPipe refusent de les charger.
    types {
        application/wasm    wasm;
        application/octet-stream  onnx tflite;
    }
    include /etc/nginx/mime.types;

    # MediaPipe utilise SharedArrayBuffer quand il peut : ces deux en-tetes le rendent
    # disponible. Ils interdisent en echange toute ressource tierce sans CORS — c'est
    # pour cela que la police est empaquetee plutot que servie par Google Fonts.
    add_header Cross-Origin-Opener-Policy   same-origin   always;
    add_header Cross-Origin-Embedder-Policy require-corp  always;
    add_header X-Content-Type-Options       nosniff       always;
    add_header Referrer-Policy              no-referrer   always;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # Attention : nginx REMPLACE les add_header d'un bloc parent des qu'un bloc enfant
    # en declare un. Utiliser `expires` seul laisse donc les en-tetes de securite du
    # bloc server en place ; ajouter un `add_header Cache-Control` ici les effacerait
    # tous, et le bundle serait servi sans nosniff.

    # Les fichiers empreintes par Vite ne changent jamais.
    location /assets/ {
        expires 1y;
    }

    # Les modeles sont gros et stables.
    location /modeles/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
