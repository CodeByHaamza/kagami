<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <title>Kagami</title>

  </head>
  <body>
    <!-- la vidéo n'est pas affichée : elle est redessinée dans le canvas avec les effets -->
    <video id="video" playsinline muted></video>
    <canvas id="scene"></canvas>
    <div id="calque3d"></div>


    <header class="barre">
      <h1><span class="kanji">鏡</span> <span data-i18n="pack.nom">Kata</span></h1>
      <button id="btnEncyclo" type="button" data-i18n-titre="barre.encyclopedie" data-i18n-aria="barre.encyclopedie">📜</button>
      <button id="btnCamera" type="button" data-i18n-titre="barre.camera" data-i18n-aria="barre.camera">🔄</button>
      <button id="btnSon" type="button" aria-pressed="false" data-i18n-titre="barre.son" data-i18n-aria="barre.son">🔊</button>
    </header>

    <!-- le signe que le modèle voit en ce moment -->
    <div id="signeVu" class="signe-vu" aria-live="polite">
      <span id="vuKanji" class="kanji"></span>
      <span id="vuNom"></span>
      <div class="jauge"><div id="vuScore"></div></div>
      <span id="vuTenu" class="tenu"></span>
    </div>

    <!-- Dans quelle posture tu es. Le joueur doit toujours le savoir : c'est elle qui
         decide si ce sont tes signes ou tes coups qui comptent. -->
    <div id="posture" class="posture" data-attitude="neutre">
      <span class="pastille-posture"></span>
      <span id="postureNom"></span>
    </div>

    <!-- L'arme selectionnee, et ce qu'il en reste. -->
    <div id="armes" class="armes" hidden>
      <span id="armeKanji" class="kanji"></span>
      <span id="armeNom"></span>
      <span id="armeStock" class="stock"></span>
    </div>

    <div id="enCours" class="en-cours"></div>

    <!-- La fiche du jutsu qu'on s'entraîne à faire : elle apparaît en fondu, montre
         l'enchaînement, et se replie en bandeau une fois qu'on a commencé. -->
    <div id="guide" class="guide" hidden>
      <div class="guide-fiche">
        <p class="type" id="guideType"></p>
        <p class="kanji" id="guideKanji"></p>
        <p class="nom" id="guideNom"></p>
        <p class="texte" id="guideTexte"></p>
      </div>
      <div id="guideSuite" class="suite"></div>
      <p id="guideProchain" class="prochain"></p>
      <div class="guide-boutons">
        <button id="btnApercu" type="button" data-i18n="guide.apercu">Montre-moi</button>
        <button id="btnFinGuide" type="button" data-i18n="guide.arreter">Arrêter</button>
      </div>
    </div>

    <!-- « Bravo » : le retour quand un jutsu s'exécute pendant l'entraînement. -->
    <div id="bravo" class="bravo" hidden>
      <p class="sceau">成</p>
      <p class="titre" data-i18n="guide.bravo">Bravo !</p>
      <p class="quoi" id="bravoQuoi"></p>
      <p class="compte" id="bravoCompte"></p>
    </div>

    <div class="bas">
      <div id="historique" class="historique"></div>
      <label class="option">
        <input type="checkbox" id="voirDetection" checked />
        <span data-i18n="detection.voir">voir la détection</span>
      </label>
    </div>

    <!-- le nom du jutsu, en grand -->
    <div id="banniere" class="banniere">
      <p class="type"></p>
      <p class="kanji"></p>
      <p class="nom"></p>
    </div>

    <!-- Le portail : le premier écran du projet. On y choisit son anime, puis le pack
         prend la main. Il est générique — il ne connaît aucun pack, il les affiche. -->
    <div id="portail" class="ecran portail">
      <div class="portail-fond" aria-hidden="true">
        <span class="orbe"></span><span class="orbe"></span><span class="orbe"></span>
      </div>
      <div class="portail-contenu">
        <p class="portail-kanji">鏡</p>
        <h1 class="portail-titre">Kagami</h1>
        <p class="portail-accroche" data-i18n="portail.accroche">
          Les gestes de ton anime, reconnus à la webcam.
        </p>
        <div id="listePacks" class="packs"></div>
        <p class="portail-pied" data-i18n="portail.pied"></p>
      </div>
    </div>

    <div id="accueil" class="ecran" hidden>
      <div class="fiche">
        <div class="langues">
          <button id="btnFr" type="button" aria-pressed="true">FR</button>
          <button id="btnEn" type="button" aria-pressed="false">EN</button>
        </div>
        <p class="grand-kanji">鏡</p>
        <h2 data-i18n="pack.nom">Kata</h2>
        <p class="sous-titre" data-i18n="pack.sousTitre">
          Les signes de Naruto, reconnus à la caméra
        </p>
        <p id="intro" data-i18n="accueil.intro"></p>
        <ul>
          <li data-i18n="accueil.conseil.mains"></li>
          <li data-i18n="accueil.conseil.tenir"></li>
          <li data-i18n="accueil.conseil.unique"></li>
          <li data-i18n="accueil.conseil.kai"></li>
        </ul>
        <button id="btnDemarrer" class="principal" type="button" data-i18n="accueil.ouvrir">
          Ouvrir la caméra
        </button>
        <button id="btnEncycloAccueil" type="button" data-i18n="accueil.encyclopedie">
          Voir l'encyclopédie
        </button>
        <button id="btnJournal" class="discret-bouton" type="button" data-i18n="accueil.journal">
          Journal de bord
        </button>
        <p id="etat" class="etat" role="status"></p>
        <p class="credits">
          <span data-i18n="accueil.credits"></span>
          <a href="https://github.com/Kazuhito00/NARUTO-HandSignDetection">NARUTO-HandSignDetection</a>
          (MIT) · MediaPipe (Apache 2.0)
        </p>
      </div>
    </div>

    <div id="encyclo" class="ecran" hidden>
      <div class="parchemin">
        <header>
          <h2 data-i18n="encyclo.titre">Encyclopédie ninja</h2>
          <p id="bilan" class="discret"></p>
          <button id="btnFermerEncyclo" type="button" data-i18n-titre="encyclo.fermer" data-i18n-aria="encyclo.fermer">✕</button>
        </header>
        <div class="onglets" role="tablist">
          <button
            type="button"
            role="tab"
            data-onglet="signes"
            aria-controls="listeSignes"
            aria-selected="true"
            data-i18n="encyclo.signes"
          >
            Les 14 signes
          </button>
          <button
            type="button"
            role="tab"
            data-onglet="jutsus"
            aria-controls="panneauJutsus"
            aria-selected="false"
            data-i18n="encyclo.jutsus"
          >
            Les jutsus
          </button>
        </div>
        <div id="listeSignes" class="liste" role="tabpanel"></div>
        <div id="panneauJutsus" role="tabpanel" hidden>
          <div id="familles" class="familles"></div>
          <div id="listeJutsus" class="liste"></div>
        </div>
      </div>
    </div>

    <!-- le journal de bord : ce qui s'est passé, même après un rechargement de la page -->
    <div id="journal" class="ecran" hidden>
      <div class="fiche">
        <h2 data-i18n="journal.titre">Journal de bord</h2>
        <p class="sous-titre" data-i18n="journal.explication"></p>
        <pre id="journalTexte" class="journal"></pre>
        <button id="btnCopierJournal" class="principal" type="button" data-i18n="journal.copier">
          Copier le journal
        </button>
        <button id="btnViderJournal" type="button" data-i18n="journal.vider">Effacer</button>
        <button id="btnFermerJournal" type="button" data-i18n="journal.fermer">Fermer</button>
      </div>
    </div>

    <p id="message" class="message" role="status" hidden></p>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
